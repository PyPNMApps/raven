[build-system]
requires = ["maturin==1.8.3"]
build-backend = "maturin"

[project]
name = "raven-pnm"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Optional native Rust PNM decoding for Python"
license = {file = "LICENSE"}

[tool.maturin]
python-source = "python"
module-name = "raven_pnm._native"
