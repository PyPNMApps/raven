[package]
name = "viewer"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[features]
default = []
credential-store = ["dep:keyring"]
merlin-fec = ["dep:merlin"]

[dependencies]
merlin = { package = "docsis-ofdm-fec", git = "https://github.com/mgarcia01752/merlin.git", rev = "096d5a476194d4f2e016863d723b225257bb6037", features = ["high-level-api"], optional = true }
pnm = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "=0.13.6", default-features = false }
zeroize = "=1.9.1"
tracing = "=0.1.41"
base64 = "=0.22.1"
ring = "=0.17.14"

ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

sha2 = "=0.10.9"
url = "2"
tempfile = "=3.23.0"

tar = "=0.4.44"
flate2 = "=1.1.5"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
zstd = { version = "=0.13.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native"] }

[dev-dependencies]
pnm-fixtures = { path = "../../tests/fixtures" }

[build-dependencies]
serde_json = "1"
pulldown-cmark = { version = "=0.13.6", default-features = false }

[[example]]
name = "fec_notch"
required-features = ["merlin-fec"]
