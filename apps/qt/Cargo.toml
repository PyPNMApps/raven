[package]
name = "raven-desktop"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[[bin]]
name = "raven"
path = "src/main.rs"

[workspace]

[dependencies]
logging = { path = "../../crates/logging" }
cxx = "=1.0.158"
cxx-qt = "=0.7.3"
cxx-qt-lib = { version = "=0.7.3", features = ["qt_gui", "qt_qml"] }
viewer = { path = "../viewer", features = ["merlin-fec", "credential-store"] }
serde_json = "1"

[build-dependencies]
# Keep generated CXX symbols aligned with the pinned cxx runtime.
cxx-gen = "=0.7.158"
cxx-qt-build = "=0.7.3"

[dev-dependencies]
pnm-fixtures = { path = "../../tests/fixtures" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keep the UI debuggable while avoiding unoptimized DSP/decoder loops in the VM.
# Release builds already optimize these dependencies through profile.release.
[profile.dev.package.docsis-ofdm-fec]
opt-level = 3

[profile.dev.package.fec-codec]
opt-level = 3

[profile.dev.package.ldpc-toolbox]
opt-level = 3
